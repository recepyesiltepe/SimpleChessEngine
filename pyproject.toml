[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-chess-engine"
version = "0.1.0"
description = "Simple chess engine with GTK 4 UI"
requires-python = ">=3.10"
dependencies = [
    "PyGObject>=3.42",
    "pycairo>=1.20",
]

[project.scripts]
simple-chess-engine = "main:main"

[project.optional-dependencies]
windows-exe = [
    "pyinstaller>=6.0",
    "pyinstaller-hooks-contrib>=2024.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*"]

[tool.setuptools]
py-modules = ["gui", "main", "user_prefs", "theme_data"]
